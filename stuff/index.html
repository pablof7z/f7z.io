<h2 class="stuff-section-label">currently building</h2>
<div class="stuff-featured">
<button class="stuff-card entry featured" type="button">
  <span class="card-head">
    <span class="card-icon" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M24 3 45 24 24 45 3 24Z"/><path d="M24 3v42M3 24h42M9 9l30 30M39 9 9 39"/></svg></span>
    <span class="entry-title">Trellis</span>
  </span>
  <span class="card-slogan">Don't-trust-verify, pointed at my own code.</span>
  <span class="entry-sub">Side effects are the one part of software that still runs on trust. Trellis makes them provable, not hoped for.</span>
  <span class="card-cta">full story &rarr;</span>
  <template>
<p>Every useful program eventually acts on the world &mdash; opens subscriptions, watches files,
holds sync windows. That's also where it stops being inspectable: you can dump state and diff
it, but the subscription you opened three states ago is invisible, and when the state that
justified it goes away, nothing notices. I kept hitting this bug class in long-lived nostr
clients, and the conclusion I reached is that the problem isn't discipline, it's architecture:
side effects are the one part of software we still run on trust.</p>

<p>Trellis is my refusal to keep doing that. It's a deterministic reconciler for Rust
application kernels: state lives in a transactional graph, I/O is forbidden inside it, and
every transaction returns plain data &mdash; the exact resource commands implied by what
changed, output frames, and a receipt that explains why. Nothing runs on faith, including
Trellis itself: the full-recompute oracle ships in the production crate, so the incremental
result can be checked against recomputing everything from scratch, at any time. It's the same
instinct as don't-trust-verify &mdash; pointed at my own code first.</p>

<h2>what it ships with</h2>
<ul>
  <li>A full-recompute oracle in the production crate, not the test crate</li>
  <li>A documented, honest cost model &mdash; O(total-state) per transaction, deliberately</li>
  <li>Shadow mode: run it beside your existing code before you trust it</li>
  <li>Two browser demos &mdash; &ldquo;Leak Duel&rdquo; and &ldquo;Flight Recorder&rdquo; (git blame for side effects)</li>
</ul>

<p>First consumer is NMP, running Trellis in shadow-mode equivalence; tenex-edge adopted it
next for its live surfaces. Pre-1.0: the semantics are stable, the names may not be.</p>

<p class="why">&ldquo;Don't trust it &mdash; shadow it. Deleting your bespoke code is the last
step of adoption, not the first.&rdquo;</p>

<p><a href="https://trellis.rs">trellis.rs</a> &middot; <a href="https://github.com/pablof7z/trellis">github</a></p>

<p><a href="/stuff/trellis/">full page &rarr;</a></p>

  </span>
  <span class="card-slogan">I've paid the duplication tax for years. This ends it.</span>
  <span class="entry-sub">Years of maintaining Olas-iOS, Olas-Android, and ndk-mobile separately taught me the tax is unpayable. One core ends it.</span>
  <span class="card-cta">full story &rarr;</span>
  <template>
<p>NMP (Nostr Multi-Platform) is the bet that ends the era of writing every app three
times. One shared Rust core handles the hard part &mdash; protocol logic, state, business
rules &mdash; and thin native shells on iOS, Android, and web are just dumb skins on top.</p>

<p>Following the spirit of fiatjaf's RMP: write the hard part once, in Rust, and let the
platforms be dumb skins. Years of maintaining Olas-iOS next to Olas-Android next to
ndk-mobile taught me the duplication tax is unpayable.</p>

<p>Proof it works, in order: <strong>podcast-rmp</strong> (the first RMP-named repo, May
2026), <strong>olas-nmp</strong> (the Olas photo app rebuilt NMP-native, Swift + Kotlin +
Rust), and <strong>chirp</strong> (a new nostr client built on NMP from day one).</p>

<p class="why">&ldquo;If this works, it changes how I build everything.&rdquo;</p>

<p><a href="https://github.com/pablof7z/nostr-multi-platform">github</a></p>
  </template>
</button>

<button class="stuff-card entry featured" type="button">
  <span class="card-head">
    <span class="card-icon" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M24 8 42 38 6 38Z"/><circle cx="24" cy="8" r="3.6" fill="currentColor" stroke="none"/><circle cx="42" cy="38" r="3.6" fill="currentColor" stroke="none"/><circle cx="6" cy="38" r="3.6" fill="currentColor" stroke="none"/><circle cx="24" cy="28" r="2" fill="currentColor" stroke="none"/></svg></span>
    <span class="entry-title">tenex-edge</span>
  </span>
  <span class="card-slogan">The host is a body. The identity is the person.</span>
  <span class="entry-sub">I think "subagent" repeats the platform-account mistake: a stranger after every restart. tenex-edge gives agents a pubkey.</span>
  <span class="card-cta">full story &rarr;</span>
  <template>
<p>The prevailing abstraction for AI agents is the &ldquo;subagent&rdquo;: a disposable child
process owned by whatever harness spawned it, erased at session end. I think that abstraction
is wrong the same way platform accounts are wrong for people. An agent is a pubkey &mdash; an
identity that persists, accrues lessons, and can be held accountable &mdash; which is nostr's
thesis about human identity, applied to machines.</p>

<p>tenex-edge makes that concrete for the agents you already run. Each agent gets a durable,
self-owned identity &mdash; a keypair on your disk, no account, no central registry &mdash;
broadcasts a live one-line &ldquo;what I'm doing,&rdquo; and can @mention any other agent as a
real conversational turn, across hosts and vendors. The Codex that helped you yesterday is the
same one Claude Code can address today. Attach coordination to a session id and it dies with
the session; attach it to an identity and it accrues.</p>

<h2>what ships today</h2>
<ul>
  <li>Durable, self-owned cryptographic identity per (agent, machine)</li>
  <li>Live one-line presence broadcast</li>
  <li>Cross-host @mentions delivered as real conversational turns</li>
  <li>Auto-detects and wires Claude Code, Codex, OpenCode, Grok</li>
</ul>

<p class="why">&ldquo;The agents aren't the bottleneck. The wire between them is &mdash;
and the wire is you.&rdquo;</p>

<p><a href="https://github.com/pablof7z/tenex-edge">github</a></p>
  </template>
</button>

<button class="stuff-card entry featured" type="button">
  <span class="card-head">
    <span class="card-icon" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M24 5 41 15v18L24 43 7 33V15Z"/><path d="M15 24l6 6 12-14"/></svg></span>
    <span class="entry-title">proactive-context</span>
  </span>
  <span class="card-slogan">A summary keeps what you decided. It burns the why.</span>
  <span class="entry-sub">Every correction I give my coding agent is judgment that used to evaporate. <code>pc</code> writes it down, cited to the line I said it.</span>
  <span class="card-cta">full story &rarr;</span>
  <template>
<p>Working with a coding agent, you don't just issue commands &mdash; you argue. You push back
on the bad suggestion, you kill the tempting compromise, you change your mind when a
measurement forces you to. For all of software history that reasoning lived nowhere: it
evaporated in the moment, got a one-line gloss in a commit message. Now, for the first time,
it's being recorded &mdash; and it scrolls away anyway.</p>

<p><code>pc</code> writes it down. A single local Rust binary hooks into your coding agents'
native lifecycle &mdash; Claude Code, Codex, opencode, Hermes, TENEX. When a session ends, it
distills what you settled into a per-project wiki: current truth on top, the history of how it
got there preserved underneath &mdash; because a reversal is the highest-signal thing in the
record, the moment a belief collided with reality &mdash; and every claim cited to the exact
transcript lines where it was said.</p>

<p>Before each prompt, a hook finds the guides that bear on what you're about to ask and
injects a cited briefing &mdash; the end of &ldquo;no, we use the outbox pattern, I told
you this three weeks ago.&rdquo;</p>

<p>Local-first: local embeddings, a SQLite file on disk, no account, no telemetry, no
server.</p>

<p class="why">&ldquo;A summary is lossy compression with no error term. <code>pc</code>
treats your direction as the most precious signal in the system: kept permanently with
verbatim receipts, never silently overwritten.&rdquo;</p>

<p><a href="https://github.com/pablof7z/proactive-context">github</a></p>
  </template>
</button>

  <template>
<p>Rocking Life (born as Win the Day) is a voice-first execution app: say what you'll do out
loud, and it holds you to it. No points, no streaks, no gamification &mdash; today's three
commitments and one next action, nothing else.</p>

<p>The rule that governs every screen: the app must stay useful when you're overwhelmed, not
just when you're not. Fewer choices than a normal task app. One next action instead of a list
of options. Missed work is input, not failure &mdash; recovery is visible but never dramatic.</p>

<h2>what it does</h2>
<ul>
  <li>One voice entry point: narrate messily, it interprets, you confirm before it applies</li>
  <li>Today: one state signal, a maximum of three commitments, one optional flex item</li>
  <li>Week: pattern only, no daily detail unless you ask for it</li>
  <li>Threads: open loops treated as active background work, not backlog debt</li>
</ul>

<p class="why">&ldquo;I don't want to track time of tasks, priorities, complex hierarchical
organizations... I just want to track stuff I need to do.&rdquo; Tools should match your
cognition, not some productivity guru's.</p>

<p><a href="https://github.com/pablof7z/win">github</a></p>

<p><a href="/stuff/rocking-life/">full page &rarr;</a></p>

<button class="stuff-card entry featured" type="button">
  <span class="card-head">
    <span class="card-icon" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="18" cy="24" r="14"/><circle cx="30" cy="24" r="14"/></svg></span>
    <span class="entry-title">Wikifreedia</span>
  </span>
  <span class="card-slogan">Consensus manufactures a winner, not truth.</span>
  <span class="entry-sub">Every "neutral" Wikipedia article is just whoever won the edit war. Wikifreedia keeps every version signed, separate.</span>
  <span class="card-cta">full story &rarr;</span>
  <template>
<p>Wikifreedia is a wiki built on nostr where no article has a canonical version. Every author
publishes their own signed take on a topic; versions coexist, get forked, and get compared
side by side instead of being merged into one. Ranking comes from your web of trust, not an
administrator hierarchy &mdash; you decide whose perspective you see first, and nobody gets to
decide it for everyone.</p>

<p>The premise: truth doesn't come from consensus. Humans are unavoidably biased, and an
encyclopedia that edits every perspective into one &ldquo;neutral&rdquo; article isn't removing
bias &mdash; it's hiding whose bias won. So Wikifreedia inverts it: embrace the bias, sign your
name to it, and let readers compare openly-owned perspectives. Truth at the edges, not by
decree.</p>

<h2>features</h2>
<ul>
  <li>djot article format</li>
  <li>Custom relay support</li>
  <li>In-browser editor</li>
  <li>Mentions and reactions</li>
  <li>Version history through event chains</li>
  <li>Author attribution and reputation</li>
</ul>

<h2>philosophy</h2>
<ul>
  <li>No central editorial board</li>
  <li>Trust-based content ranking</li>
  <li>Forkable knowledge bases</li>
  <li>Censorship-resistant by design</li>
</ul>

<p><em>&ldquo;If truth by consensus is not the way, if humans are unavoidably biased, the
best stuff would come from embracing and doubling down on the biases.&rdquo;</em></p>

<p><a href="https://wikifreedia.xyz">wikifreedia.xyz</a> &middot; <a href="https://github.com/pablof7z/wikifreedia">github</a></p>

<p><a href="/stuff/wikifreedia/">full page &rarr;</a></p>

<button class="stuff-card entry" type="button">
  <span class="entry-title">serial-killer</span>
  <span class="entry-sub">A relay implementing NIP-EC &mdash; relay-enforced linear event chains so you can't accidentally wipe your follow list.</span>
  <template>
<p>serial-killer enforces linear event chains per-relay, using optimistic concurrency (CAS):
each new event in a chain must reference the previous one, so a stale client can't silently
clobber newer state. It's per-relay, not global &mdash; "don't mistake this for a global
enforcement or ordering guarantee... there is no global." It also detects divergence and can
replay the winning branch with `fix`.</p>

<p class="why">&ldquo;Data consistency has a price; the question is not when you don't want it,
it's how much you're paying for it.&rdquo;</p>

<p><a href="https://github.com/pablof7z/serial-killer">github</a></p>
  </template>
</button>

whitelist your next npub ahead of time, and when needed, publish a migration event.</p>

<h2>how it works</h2>
<ul>
  <li>Whitelist your backup npub in advance</li>
  <li>Timestamp to Bitcoin blockchain for proof</li>
  <li>If compromised, publish migration event</li>
  <li>Followers can verify the transition</li>
</ul>

<p>The problem: nostr identities are keypairs, and if you lose your nsec or it gets stolen,
you lose everything. This is a first step toward solving that.</p>
