<button class="stuff-card entry featured" type="button">
  <span class="entry-title">NMP</span>
  <span class="entry-sub">One Rust core, three platforms, zero rewrites.</span>
  <template>
<p>NMP (Nostr Multi-Platform) is the bet that ends the era of writing every app three
times. One shared Rust core handles the hard part &mdash; protocol logic, state, business
rules &mdash; and thin native shells on iOS, Android, and web are just dumb skins on top.</p>

<p>Following the spirit of fiatjaf's RMP: write the hard part once, in Rust, and let the
platforms be dumb skins. Years of maintaining Olas-iOS next to Olas-Android next to
ndk-mobile taught me the duplication tax is unpayable.</p>

<p>Proof it works, in order: <strong>podcast-rmp</strong> (the first RMP-named repo, May
2026), <strong>olas-nmp</strong> (the Olas photo app rebuilt NMP-native, Swift + Kotlin +
Rust), and <strong>chirp</strong> (a new nostr client built on NMP from day one).</p>

<p class="why">&ldquo;If this works, it changes how I build everything.&rdquo;</p>

<p><a href="https://github.com/pablof7z/nostr-multi-platform">github</a></p>
  </template>
</button>

<button class="stuff-card entry featured" type="button">
  <span class="entry-title">tenex-edge</span>
  <span class="entry-sub">Stop being the message bus between your own agents.</span>
  <template>
<p>You run Claude Code, Codex, and OpenCode on the same repo, and all day <em>you</em>
are the wire between them: routing work, checking overlap, deciding merge order,
re-explaining context to every new session.</p>

<p>tenex-edge is an identity and awareness fabric for the agents you already run. Each
agent gets a durable, self-owned identity, broadcasts a live one-line &ldquo;what I'm
doing,&rdquo; and can @mention any other agent directly &mdash; across hosts and vendors,
no copy-paste, no shared session.</p>

<h2>what ships today</h2>
<ul>
  <li>Durable, self-owned cryptographic identity per (agent, machine)</li>
  <li>Live one-line presence broadcast</li>
  <li>Cross-host @mentions delivered as real conversational turns</li>
  <li>Auto-detects and wires Claude Code, Codex, OpenCode, Grok</li>
</ul>

<p class="why">&ldquo;The agents aren't the bottleneck. The wire between them is &mdash;
and the wire is you.&rdquo;</p>

<p><a href="https://github.com/pablof7z/tenex-edge">github</a></p>
  </template>
</button>

<button class="stuff-card entry featured" type="button">
  <span class="entry-title">proactive-context</span>
  <span class="entry-sub">Your spec already exists, scattered across chats with your coding agent.</span>
  <template>
<p>Every decision you've made, every correction you've issued, every time you changed
your mind &mdash; you said it once, to your coding agent, and it scrolled away. The spec
exists; it was just never written down in one place.</p>

<p><code>pc</code> writes it down. A single local Rust binary hooks into your coding
agents' native lifecycle &mdash; Claude Code, Codex, opencode, Hermes, TENEX. When a
session ends, it distills what you settled into a per-project wiki: current truth on top,
the history of how it got there preserved underneath, every claim cited to the exact
transcript lines where it was said.</p>

<p>Before each prompt, a hook finds the guides that bear on what you're about to ask and
injects a cited briefing &mdash; the end of &ldquo;no, we use the outbox pattern, I told
you this three weeks ago.&rdquo;</p>

<p>Local-first: local embeddings, a SQLite file on disk, no account, no telemetry, no
server.</p>

<p class="why">&ldquo;A summary is lossy compression with no error term. <code>pc</code>
treats your direction as the most precious signal in the system: kept permanently with
verbatim receipts, never silently overwritten.&rdquo;</p>

<p><a href="https://github.com/pablof7z/proactive-context">github</a></p>
  </template>
</button>

<ul>

  <li><strong>ndk-svelte</strong> &mdash; Svelte 5 bindings with reactive stores</li>

  <li><strong>ndk-mobile</strong> &mdash; React Native/Expo for iOS and Android</li>
  <li><strong>ndk-wallet</strong> &mdash; NIP-60 wallet support</li>
  <li><strong>ndk-cache-dexie</strong> &mdash; IndexedDB caching</li>
  <li><strong>ndk-cache-redis</strong> &mdash; Redis caching for servers</li>
  <li><strong>ndk-cli</strong> &mdash; command-line interface</li>
  <li><strong>NDKSwift</strong> &mdash; Swift port for iOS/macOS</li>
</ul>

<h2>features</h2>
<ul>
  <li>Outbox model (NIP-65) for decentralized relay discovery</li>
  <li>Subscription queueing for efficient relay usage</li>
  <li>Automatic signature verification</li>
  <li>Blossom media support</li>
  <li>NIP-46 remote signing</li>
  <li>Event threading and replies</li>
  <li>Negentropy sync support</li>
</ul>

<p>Used by Olas, Highlighter, Coracle, Primal, and dozens of other nostr clients.</p>

<a href="/nownownow/#y2024-11">the changelog</a> for why I killed my own successful product.</p>

<button class="stuff-card entry" type="button">
  <span class="entry-title">Kind0.io</span>
  <span class="entry-sub">Rotate your nostr keys without losing your identity when your nsec is compromised.</span>
  <template>
<p>If your key gets compromised, Kind0.io lets you prove ownership of a new key. You
whitelist your next npub ahead of time, and when needed, publish a migration event.</p>

<h2>how it works</h2>
<ul>
  <li>Whitelist your backup npub in advance</li>
  <li>Timestamp to Bitcoin blockchain for proof</li>
  <li>If compromised, publish migration event</li>
  <li>Followers can verify the transition</li>
</ul>

<p>The problem: nostr identities are keypairs, and if you lose your nsec or it gets stolen,
you lose everything. This is a first step toward solving that.</p>

<p><a href="https://kind0.io">kind0.io</a></p>

<p><a href="/stuff/kind0/">full page &rarr;</a></p>
